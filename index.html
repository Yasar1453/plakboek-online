<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ons plakboek</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a8434e' d='M12 21s-7.5-4.9-10-9.5C.4 8.4 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.4h4C14.8 6.1 16.2 5 18.2 5c3.4 0 5.4 3.4 3.8 6.5C19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/boek.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <main class="toneel">
    <div id="boek-houder">
      <div id="boek"></div>
    </div>

    <nav class="blader-knoppen" aria-label="Bladeren">
      <button id="knop-vorige" class="blader-knop" type="button" aria-label="Vorige pagina">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span id="pagina-stand" class="pagina-stand"></span>
      <button id="knop-volgende" class="blader-knop" type="button" aria-label="Volgende pagina">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>
  </main>


  <!-- Overlay: kaart met onze plekken -->
  <div id="kaart-overlay" class="kaart-overlay verborgen" role="dialog" aria-modal="true" aria-label="Onze plekken">
    <div class="kaart-kop">
      <h2>Onze plekken</h2>
      <button type="button" id="knop-kaart-sluit" class="blader-knop" aria-label="Kaart sluiten">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="kaart"></div>
  </div>


  <script>window.PLAKBOEK_STATISCH = true;</script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/stickers.js"></script>
  <script src="js/boek.js"></script>
  <script src="js/kaart.js"></script>
  <script src="js/feest.js"></script>
</body>
</html>
